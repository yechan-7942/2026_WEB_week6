<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>식품 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="h3 mb-4">식품 등록</h1>

            <form th:action="@{/products}" method="post" class="bg-white p-4 rounded shadow-sm">
                <div class="mb-3">
                    <label for="name" class="form-label">식품이름</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">카테고리</label>
                    <input type="text" class="form-control" id="category" name="category" required>
                </div>
                <div class="mb-3">
                    <label for="quantity" class="form-label">수량</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" min="0" required>
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">가격</label>
                    <input type="number" class="form-control" id="price" name="price" min="0" required>
                </div>
                <div class="mb-4">
                    <label for="expirationDate" class="form-label">유통기한</label>
                    <input type="date" class="form-control" id="expirationDate" name="expirationDate" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">등록</button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">목록으로</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
